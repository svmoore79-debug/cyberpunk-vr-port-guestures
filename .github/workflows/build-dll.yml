# VRGestures fork: builds the port plugin (cyberpunkvrport.dll, 0.2.0) for game 2.5 on a GitHub Windows runner and
# packages it with the port Lua mods and scripts the fork patches. Download the "CyberpunkVRPort-0.2.0-vrgestures"
# artifact from the run page and install it over the official 0.2.0 zip (vrgestures/install_local.ps1 -Artifact).
name: Build VR port DLL

on:
  push:
    branches: ['vrgestures-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # The SDK the 2.5 build needs: RED4ext.SDK master "Update types for patch 2.5" (#232, 2026-10-24).
      # The submodule (externals/RED4ext.SDK) is still the 2.31-era commit; upstream builds 2.5 against
      # SDK master in a separate tree. The plugin checks these layouts at every start ([sdk-layout] in
      # cyberpunkvrport.log), so a mismatch shows up there.
      SDK_REPO: https://github.com/wopss/RED4ext.SDK.git
      SDK_COMMIT: 5246e659d783e5834cc08a90e56c8932c9ed3449
    steps:
      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply the VRGestures fork patches
        run: python vrgestures/apply_patches.py

      - name: Get RED4ext.SDK for game 2.5
        shell: pwsh
        run: |
          git clone --quiet $env:SDK_REPO sdk25
          git -C sdk25 checkout --quiet $env:SDK_COMMIT
          git -C sdk25 log -1 --oneline

      # Job logs need a GitHub sign-in to read, annotations do not: on failure, the tail of the output is
      # posted as one error annotation so it can be read from the API or the run page while signed out.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCVR_RED4EXT_SDK_DIR=${{ github.workspace }}/sdk25" 2>&1 | Tee-Object -FilePath configure.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content configure.log -Tail 60) -join "`n"
            $msg = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Configure failed (cmake exit $code)::$msg"
            exit $code
          }

      - name: Build the plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --target cyberpunkvrport_stereo --parallel 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = Select-String -Path build.log -Pattern ' error |: fatal error|error MSB|LINK : fatal' | Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }
            if (-not $errs) { $errs = Get-Content build.log -Tail 60 }
            $msg = ($errs -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Build failed (exit $code)::$msg"
            exit $code
          }

      # 0.2.0: everything lives in the plugin's own folder -- the DLL, its Lua mods (lua\) and its scripts (scripts\).
      # Install the official 0.2.0 zip first, then this over it (vrgestures/install_local.ps1 does both).
      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter cyberpunkvrport.dll | Select-Object -First 1
          $pdb = Get-ChildItem build -Recurse -Filter cyberpunkvrport.pdb | Select-Object -First 1
          if (-not $dll) { throw "cyberpunkvrport.dll was not built" }
          $out  = "pkg"
          $plug = "$out/red4ext/plugins/cyberpunkvrport"
          $reds = "$plug/scripts/CyberpunkVRPort_Cyberware"
          New-Item -ItemType Directory -Force $plug, $reds, "$plug/lua/CyberpunkVRPort_Weapon", "$plug/lua/CyberpunkVRPort_WristHud", "$plug/lua/CyberpunkVRPort_Menu/modules" | Out-Null
          Copy-Item $dll.FullName $plug
          foreach ($f in 'vrport_cyberware.reds', 'vrport_launcher_aim.reds', 'vrport_launcher_selection.reds') {
            Copy-Item "mods/redscript/CyberpunkVRPort_Cyberware/$f" $reds
          }
          Copy-Item mods/cet/CyberpunkVRPort_Weapon/init.lua "$plug/lua/CyberpunkVRPort_Weapon"
          Copy-Item mods/cet/CyberpunkVRPort_WristHud/init.lua "$plug/lua/CyberpunkVRPort_WristHud"
          Copy-Item mods/cet/CyberpunkVRPort_Menu/modules/menu.lua "$plug/lua/CyberpunkVRPort_Menu/modules"
          Copy-Item mods/cet/CyberpunkVRPort_Menu/modules/quickwheel.lua "$plug/lua/CyberpunkVRPort_Menu/modules"
          New-Item -ItemType Directory -Force symbols | Out-Null
          if ($pdb) { Copy-Item $pdb.FullName symbols }
          "Built from $env:GITHUB_SHA on $env:GITHUB_REF_NAME, RED4ext.SDK $env:SDK_COMMIT" | Out-File "$out/VRGESTURES_FORK_BUILD.txt"
          Get-ChildItem $out -Recurse | Select-Object FullName, Length

      - name: Upload the package
        uses: actions/upload-artifact@v5
        with:
          name: CyberpunkVRPort-0.2.0-vrgestures
          path: pkg/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v5
        with:
          name: cyberpunkvrport-pdb
          path: symbols/
